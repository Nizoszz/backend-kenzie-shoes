<article class="product-card">
  <div class="product-image"><img src="{{ product.image_product }}" alt="{{ product.name }}" loading="lazy"><span>{{ product.category }}</span></div>
  <div class="product-body"><div><h3>{{ product.name }}</h3><p>{{ product.description|truncatechars:90 }}</p></div><div class="product-bottom"><div><strong>R$ {{ product.value }}</strong><small>{{ product.stock }} em estoque</small></div>{% if product.stock > 0 %}{% if user.is_authenticated %}<form action="{% url 'storefront:cart_add' product.id %}" method="post">{% csrf_token %}<input type="hidden" name="quantities" value="1"><input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="icon-button" type="submit" aria-label="Adicionar {{ product.name }} ao carrinho">+</button></form>{% else %}<a class="icon-button" href="{% url 'storefront:login' %}?next={{ request.get_full_path|urlencode }}" aria-label="Entrar para adicionar {{ product.name }} ao carrinho">+</a>{% endif %}{% else %}<span class="sold-out">Esgotado</span>{% endif %}</div></div>
</article>
