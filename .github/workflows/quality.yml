name: Quality and tests

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Django checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff formatting
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema generation
        run: python manage.py spectacular --file /tmp/schema.yaml --validate

      - name: Django deployment checks
        env:
          DEBUG: "false"
          SECRET_KEY: ci-deployment-check-secret-key-at-least-thirty-two-bytes
          ALLOWED_HOSTS: example.com
          POSTGRESQL_DB_NAME: commerce
          POSTGRESQL_USERNAME: commerce
          POSTGRESQL_PASSWORD: commerce
          POSTGRESQL_DB_HOST: localhost
          POSTGRESQL_DB_PORT: "5432"
        run: python manage.py check --deploy

  tests:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_POSTGRES_DB: commerce_test
      TEST_POSTGRES_USER: commerce
      TEST_POSTGRES_PASSWORD: commerce
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commerce_test
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run test suite
        run: pytest --cov=addresses --cov=cart --cov=orders --cov=products --cov=storefront --cov=users --cov-report=term-missing --cov-fail-under=80
