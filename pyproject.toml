[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "DJ", "UP"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"_core/settings_test.py" = ["F403", "F405"]
"**/tests.py" = ["B017"]
"**/test_*.py" = ["B017"]
